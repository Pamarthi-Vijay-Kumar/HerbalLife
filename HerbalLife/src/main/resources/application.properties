
spring.application.name=HerbalLife
server.port=${PORT:8082}

spring.data.mongodb.database=HerbalLife-api
# Reads from the MONGODB_URI environment variable if set; otherwise falls back
# to the value below. Set MONGODB_URI in your environment (or run config /
# IDE run configuration) instead of committing credentials here.
# IMPORTANT: this fallback credential has been shared in a chat session and
# should be rotated in your MongoDB Atlas dashboard.
spring.data.mongodb.uri=${MONGODB_URI}


logging.level.org.springframework.data.mongodb=INFO
logging.level.org.mongodb.driver=INFO


spring.jpa.hibernate.ddl-auto=update



razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}




# Email (SMTP) — used for order confirmation emails.
# For Gmail: enable 2FA, then create an "App Password" (not your normal
# password) at https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# If SMTP isn't configured yet, order placement still succeeds — email sending
# is wrapped in a try/catch so a bad SMTP config never blocks an order.